<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<title>Ask survey — results</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #1a1a2e; --parchment: #faf8f3; --orange: #c84b0f;
  --navy: #2b2b52; --line: #e8e4dc; --muted: #8a857c;
  --serif: 'Fraunces', Georgia, serif; --sans: 'Inter Tight', system-ui, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: var(--parchment); color: var(--ink); font-family: var(--sans); display: flex; justify-content: center; padding: 0 20px 64px; }
.col { width: 100%; max-width: 560px; }
.eyebrow { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--orange); font-weight: 600; margin-bottom: 8px; }
h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; margin: 0 0 20px; }
.gate { padding-top: 96px; text-align: center; }
.gate input { font-size: 15px; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--line); font-family: inherit; margin-right: 8px; }
.gate button { background: var(--navy); color: #fff; border: none; border-radius: 8px; padding: 12px 18px; font-size: 14px; cursor: pointer; font-family: inherit; }
.gate .err { color: var(--orange); font-size: 13px; margin-top: 12px; }
.stats { display: flex; gap: 10px; margin-bottom: 24px; flex-wrap: wrap; }
.stat { flex: 1 1 120px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.stat .label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
.stat .value { font-size: 22px; font-weight: 600; }
.stat .value small { font-size: 13px; color: var(--muted); }
.bars { margin-bottom: 28px; }
.bar-row { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
.bar-row .yr { width: 130px; font-size: 12px; color: var(--navy); flex-shrink: 0; }
.bar-row .track { flex: 1; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.bar-row .fill { height: 100%; background: var(--orange); }
.bar-row .n { font-size: 12px; color: var(--muted); width: 20px; text-align: right; }
.section-label { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: 12px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
.row { padding: 14px 0; border-bottom: 1px solid var(--line); }
.row .q { font-family: var(--serif); font-size: 16px; line-height: 1.5; margin: 0 0 6px; color: var(--ink); }
.row .wand { font-size: 14px; line-height: 1.5; margin: 0 0 6px; color: var(--navy); padding-left: 12px; border-left: 2px solid var(--orange); }
.row .wand .tag { color: var(--orange); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; }
.row .meta { font-size: 12px; color: var(--muted); }
.empty { color: var(--muted); font-size: 14px; }
.refresh { margin-top: 24px; background: none; border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; color: var(--navy); font-size: 13px; cursor: pointer; font-family: inherit; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<div class="col gate" id="gateView">
  <div class="eyebrow" style="margin-bottom:24px;">Haven · organiser view</div>
  <div>
    <input type="password" id="passInput" placeholder="passcode" autocomplete="off">
    <button id="passBtn">View</button>
  </div>
  <div class="err" id="gateErr" hidden></div>
</div>

<div class="col" id="resultsView" hidden>
  <div class="eyebrow">Organiser view</div>
  <h1 id="heading">Gathering answers…</h1>
  <div id="body"></div>
  <button class="refresh" id="refreshBtn">Refresh</button>
</div>

<script>
(function () {
  var YEARS = ['Not near this yet', 'Year 4 or below', 'Year 5', 'Year 6', 'Year 7', 'Year 8 or above'];
  var SESSION_KEY = 'haven-ask-passcode';

  var gateView = document.getElementById('gateView');
  var resultsView = document.getElementById('resultsView');
  var passInput = document.getElementById('passInput');
  var passBtn = document.getElementById('passBtn');
  var gateErr = document.getElementById('gateErr');
  var heading = document.getElementById('heading');
  var body = document.getElementById('body');
  var refreshBtn = document.getElementById('refreshBtn');

  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  async function loadResults(passcode) {
    heading.textContent = 'Gathering answers…';
    body.innerHTML = '';
    var res = await fetch('/api/ask-survey?passcode=' + encodeURIComponent(passcode));
    if (!res.ok) throw new Error('unauthorized');
    var data = await res.json();
    render(data.rows || []);
  }

  function render(rows) {
    heading.textContent = rows.length + (rows.length === 1 ? ' reply so far' : ' replies so far');

    var withWeight = rows.filter(function (r) { return r.weight > 0; });
    var avg = withWeight.length
      ? (withWeight.reduce(function (s, r) { return s + r.weight; }, 0) / withWeight.length).toFixed(1)
      : '—';
    var leftContact = rows.filter(function (r) { return r.contact || r.name; }).length;
    var byYear = YEARS.map(function (y) {
      return { y: y, n: rows.filter(function (r) { return r.year === y; }).length };
    }).filter(function (x) { return x.n; });

    var html = '';
    html += '<div class="stats">';
    html += '<div class="stat"><div class="label">Average weight</div><div class="value">' + avg + '<small> / 5</small></div></div>';
    html += '<div class="stat"><div class="label">Left contact</div><div class="value">' + leftContact + '</div></div>';
    html += '</div>';

    if (byYear.length) {
      html += '<div class="bars">';
      byYear.forEach(function (row) {
        var pct = rows.length ? (row.n / rows.length) * 100 : 0;
        html += '<div class="bar-row"><div class="yr">' + escapeHtml(row.y) + '</div><div class="track"><div class="fill" style="width:' + pct + '%"></div></div><div class="n">' + row.n + '</div></div>';
      });
      html += '</div>';
    }

    html += '<div class="section-label">In their own words</div>';
    if (!rows.length) {
      html += '<p class="empty">No answers yet. Share the link and check back.</p>';
    }
    rows.forEach(function (r) {
      html += '<div class="row">';
      html += '<p class="q">“' + escapeHtml(r.question) + '”</p>';
      if (r.wand) {
        html += '<p class="wand"><span class="tag">Wand · </span>' + escapeHtml(r.wand) + '</p>';
      }
      var metaParts = [r.name, r.year, r.weight ? ('weight ' + r.weight + '/5') : null, r.contact].filter(Boolean);
      html += '<div class="meta">' + escapeHtml(metaParts.join(' · ')) + '</div>';
      html += '</div>';
    });

    body.innerHTML = html;
  }

  function unlock(passcode) {
    loadResults(passcode).then(function () {
      sessionStorage.setItem(SESSION_KEY, passcode);
      gateView.hidden = true;
      resultsView.hidden = false;
    }).catch(function () {
      gateErr.textContent = 'Not that one.';
      gateErr.hidden = false;
    });
  }

  passBtn.addEventListener('click', function () { unlock(passInput.value.trim()); });
  passInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') unlock(passInput.value.trim());
  });
  refreshBtn.addEventListener('click', function () {
    var pass = sessionStorage.getItem(SESSION_KEY);
    if (pass) loadResults(pass).catch(function () {});
  });

  var stored = sessionStorage.getItem(SESSION_KEY);
  if (stored) unlock(stored);
})();
</script>
</body>
</html>
